[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-rgbd-tracking-benchmark"
version = "0.3.0"
description = "RGB-D benchmark for SAM-MT and EfficientTAM with SAM3 keyframes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Haocheng Zhao"}]
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.12,<2",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10.2",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "tqdm>=4.66",
  "pandas>=2.2,<3",
  "psutil>=5.9",
  "huggingface-hub>=0.27,<2",
  # SAM3 imports its COCO loader while importing the image-model builder.
  "pycocotools>=2.0.8,<3",
  # SAM3's dataset module exposes optional video loading in the same import tree.
  "decord==0.6.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
sam-rgbd-tracking = "sam_rgbd_tracking_benchmark.node:main"
sam-rgbd-replay = "sam_rgbd_tracking_benchmark.replay:main"
sam-rgbd-evaluate = "sam_rgbd_tracking_benchmark.evaluation:main"
sam-rgbd-timing = "sam_rgbd_tracking_benchmark.timing_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
