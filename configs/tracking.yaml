runtime:
  camera_names: [camera_0, camera_1]
  target_hz: 30.0
  queue_size: 1
  drop_when_busy: true
  serialize_gpu: true
  device: cuda
  use_bf16: true
  enable_tf32: true
  publish_debug_images: true

# Exact topic names published by ScenePredictor/YOLOE isaacscene/ros_camera_publisher.py.
ros:
  world_frame: world
  color_topic: /{camera}/color/image_raw
  depth_topic: /{camera}/depth/image_raw
  camera_info_topic: /{camera}/camera_info
  output_prefix: /tracking/{camera}
  sync_slop_seconds: 0.02

  # After each camera has formed a local RGB-D+CameraInfo tuple, EfficientTAM
  # fixed batching waits for one tuple from every view. Their color timestamps
  # must fall inside this cross-view window. Isaac Sim publishes the two cameras
  # from the same capture tick, so 20 ms is intentionally conservative.
  multiview_sync_slop_seconds: 0.02

# SAM3 runs only on coordinated keyframes. Intermediate frames are handled by
# the selected mask tracker. With EfficientTAM multi-view execution, if one view
# requests a periodic/anomaly refresh, all views refresh together so their
# temporal-memory topology stays aligned.
detector:
  checkpoint: checkpoints/sam3.pt
  prompts:
    - ball
    - red and white can
    - mustard bottle
  score_threshold: 0.05
  mask_threshold: 0.0
  duplicate_iou_threshold: 0.85
  refresh_seconds: 5.0
  phase_offsets_seconds:
    camera_0: 0.0
    camera_1: 0.0
  trigger_on_anomaly: false
  min_frames_between_triggers: 5
  anomaly_presence_threshold: 0.05

tracker:
  backend: efficient_tam         # sam_mt | efficient_tam
  mask_threshold: 0.0
  offload_video_to_cpu: false
  offload_state_to_cpu: false
  vos_optimized: true

  # Shared streaming-state/runtime options.
  reuse_state_on_keyframe: true
  gpu_preprocess: true
  pin_input_memory: true

  sam_mt:
    checkpoint: checkpoints/sam_mt.pt
    config: configs/sam2.1/sam2.1_hiera_b+.yaml
    non_overlap_masks: true
    points_per_object: 2
    compile_image_encoder: true
    prewarm_enabled: true
    prewarm_passes: 2

  efficient_tam:
    checkpoint: checkpoints/efficienttam_s_512x512.pt
    config: configs/efficienttam/efficienttam_s_512x512.yaml
    non_overlap_masks: false

    # Main switch requested for the integration.
    # sequential  -> per-view encoder + per-object B=1 propagation (old compute)
    # fixed_batch -> one B=num_views encoder + one fixed all-view/object batch
    execution_mode: fixed_batch # sequential | fixed_batch

    # fixed_num_views is derived automatically from runtime.camera_names.
    # With two cameras and max_objects_per_view=3, fixed_batch uses B=6.
    max_objects_per_view: 3

    # Compile/capture the actual multi-view shape before live diagnostics start.
    prewarm_enabled: true
    prewarm_temporal_frames: 20
    prewarm_post_reset_frames: 2
    prewarm_passes: 2

association:
  max_centroid_distance_m: 0.35
  min_mask_iou: 0.05
  weight_centroid: 2.0
  weight_iou: 1.0
  weight_depth: 0.5
  weight_embedding: 0.35
  label_mismatch_cost: 10.0
  lost_ttl_frames: 45

postprocess:
  mask_threshold: 0.0
  overlap_depth_only: false
  depth_model_min_pixels: 40
  depth_gate_mad_scale: 4.0
  depth_gate_min_m: 0.035
  depth_gate_max_m: 0.25
  logit_weight: 0.15
  erosion_pixels: 2
  depth_edge_threshold_m: 0.04
  min_component_pixels: 30
  min_valid_depth_m: 0.10
  max_valid_depth_m: 6.0
  visible_ratio_visible: 0.60
  visible_ratio_partial: 0.15

pointcloud:
  stride: 1
  max_points_per_instance: 30000
  transform_to_world: true

profiling:
  enabled: true
  summary_interval_frames: 100
  cuda_events: true
  csv_path: logs/timing.csv
  rate_diagnostics: true
  camera_diagnostics: true
  rate_summary_interval_seconds: 5.0
