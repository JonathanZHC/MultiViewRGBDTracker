runtime:
  camera_names: [camera_0, camera_1]
  target_hz: 30.0
  queue_size: 1
  drop_when_busy: true
  serialize_gpu: true
  device: cuda
  use_bf16: true
  enable_tf32: true
  publish_debug_images: true

# Exact topic names published by ScenePredictor/YOLOE isaacscene/ros_camera_publisher.py.
ros:
  world_frame: world
  color_topic: /{camera}/color/image_raw
  depth_topic: /{camera}/depth/image_raw
  camera_info_topic: /{camera}/camera_info
  output_prefix: /tracking/{camera}
  sync_slop_seconds: 0.02

# SAM3 runs only on keyframes. Intermediate frames are handled by the selected
# mask tracker. Edit this section when you want to change prompts/refresh rate.
detector:
  checkpoint: checkpoints/sam3.pt
  prompts:
    - ball
    - red and white can
    - mustard bottle
  score_threshold: 0.05
  mask_threshold: 0.0
  duplicate_iou_threshold: 0.85
  refresh_seconds: 1.0
  phase_offsets_seconds:
    camera_0: 0.0
    camera_1: 0.0
  trigger_on_anomaly: true
  min_frames_between_triggers: 5
  anomaly_presence_threshold: 0.05

tracker:
  backend: sam_mt               # sam_mt | efficient_tam
  mask_threshold: 0.0
  offload_video_to_cpu: false
  offload_state_to_cpu: false
  vos_optimized: true
  sam_mt:
    checkpoint: checkpoints/sam_mt.pt
    config: configs/sam2.1/sam2.1_hiera_b+.yaml
    non_overlap_masks: true
    points_per_object: 2
  efficient_tam:
    checkpoint: checkpoints/efficienttam_s_2.pt
    config: configs/efficienttam/efficienttam_s_2.yaml
    non_overlap_masks: false

association:
  max_centroid_distance_m: 0.35
  min_mask_iou: 0.05
  weight_centroid: 2.0
  weight_iou: 1.0
  weight_depth: 0.5
  weight_embedding: 0.35
  label_mismatch_cost: 10.0
  lost_ttl_frames: 45

postprocess:
  mask_threshold: 0.0
  overlap_depth_only: False
  depth_model_min_pixels: 40
  depth_gate_mad_scale: 4.0
  depth_gate_min_m: 0.035
  depth_gate_max_m: 0.25
  logit_weight: 0.15
  erosion_pixels: 2
  depth_edge_threshold_m: 0.04
  min_component_pixels: 30
  min_valid_depth_m: 0.10
  max_valid_depth_m: 6.0
  visible_ratio_visible: 0.60
  visible_ratio_partial: 0.15

pointcloud:
  stride: 1
  max_points_per_instance: 30000
  transform_to_world: true

profiling:
  enabled: true
  summary_interval_frames: 100
  cuda_events: true
  csv_path: logs/timing.csv
