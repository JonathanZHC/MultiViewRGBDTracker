scene: occlusion                 # static | dynamic | occlusion
width: 640
height: 480
rgbd_hz: 30.0
headless: false
duration_seconds: 0.0           # 0 means run until Ctrl+C / window close
motion_speed_scale: 1.0
ros_domain_id: 117
world_frame: world
max_depth_m: 6.0

# Camera poses are world XYZ positions looking at a world XYZ target. The
# implementation converts them to both USD-camera and ROS-optical conventions.
cameras:
  - name: camera_0
    prim_path: /World/Cameras/camera_0
    position: [1.80, -1.80, 1.38]
    look_at: [0.0, 0.02, 0.88]
    focal_length_mm: 18.0
    horizontal_aperture_mm: 20.955
    near_m: 0.05
    far_m: 10.0
  - name: camera_1
    prim_path: /World/Cameras/camera_1
    position: [-1.65, -1.42, 1.30]
    look_at: [0.0, 0.02, 0.86]
    focal_length_mm: 18.0
    horizontal_aperture_mm: 20.955
    near_m: 0.05
    far_m: 10.0

depth_noise:
  enabled: true
  gaussian_sigma_m: 0.002
  dropout_probability: 0.002
