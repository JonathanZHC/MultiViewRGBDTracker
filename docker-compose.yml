services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAM3_REF: ${SAM3_REF:-main}
        SAM_MT_REF: ${SAM_MT_REF:-main}
        EFFICIENT_TAM_REF: ${EFFICIENT_TAM_REF:-main}
    image: ${IMAGE_NAME:-sam-rgbd-tracking-benchmark:latest}
    container_name: ${CONTAINER_NAME:-sam-rgbd-tracking}
    user: "${SAM_RGBD_CONTAINER_UID:-1234}:${SAM_RGBD_CONTAINER_GID:-1234}"
    working_dir: /workspace/sam_rgbd_tracking_benchmark
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    shm_size: 16gb
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HOME: /workspace/.home
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-117}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      XDG_RUNTIME_DIR: /tmp/runtime-sam-rgbd
      HF_HOME: /workspace/.cache/huggingface
      TORCH_HOME: /workspace/.cache/torch
      XDG_CACHE_HOME: /workspace/.cache
    volumes:
      - .:/workspace/sam_rgbd_tracking_benchmark:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.cache/sam-rgbd-tracking/home:/workspace/.home:rw
      - ${HOME}/.cache/sam-rgbd-tracking/huggingface:/workspace/.cache/huggingface:rw
      - ${HOME}/.cache/sam-rgbd-tracking/torch:/workspace/.cache/torch:rw
      - ${HOME}/.cache/sam-rgbd-tracking/warp:/workspace/.cache/warp:rw
      - ${HOME}/.cache/sam-rgbd-tracking/ov:/workspace/.cache/ov:rw
      - ${HOME}/.cache/sam-rgbd-tracking/kit:/isaac-sim/kit/cache:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
